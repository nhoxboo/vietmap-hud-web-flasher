[platformio]
default_envs = esp32_2432s024

[common]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = min_spiffs.csv
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.4
    bodmer/TFT_eSPI @ ^2.5.43

# ==============================================================================
# 1. ESP32-2432S024 (CYD 2.4" / 2.8" Màn hình chữ nhật 320x240 ILI9341)
# ==============================================================================
[env:esp32_2432s024]
platform = ${common.platform}
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
board_build.partitions = ${common.board_build.partitions}
lib_deps = ${common.lib_deps}
build_flags =
    -D BOARD_ESP32_2432S024
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1

# ==============================================================================
# 2. ESP32-2424S012 (Màn hình tròn 1.28" 240x240 GC9A01)
# ==============================================================================
[env:esp32_2424s012]
platform = ${common.platform}
board = esp32dev
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
upload_speed = ${common.upload_speed}
board_build.partitions = ${common.board_build.partitions}
lib_deps = ${common.lib_deps}
build_flags =
    -D BOARD_ESP32_2424S012
    -D USER_SETUP_LOADED=1
    -D GC9A01_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=40000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT7=1
